<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFM Trader</title><style>
:root{--bg:#0f1318;--p:#171d24;--l:#303a46;--t:#edf2f7;--m:#8e99a7;--a:#90b0ff;--g:#70f59c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:10;background:#11161cfa;border-bottom:1px solid var(--l);padding:18px}.sub{color:var(--m);font-size:12px}.tools{display:grid;grid-template-columns:2fr repeat(7,1fr);gap:8px;margin-top:12px}input,select,button{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:8px;padding:8px}button{cursor:pointer}main{padding:18px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.badge{background:var(--p);border:1px solid var(--l);padding:6px 10px;border-radius:99px;font-size:12px}.wrap{overflow:auto;border:1px solid var(--l);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:1150px}th,td{padding:9px 8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap;font-size:12px}th{position:sticky;top:0;background:var(--p);color:var(--m);font-size:10px;text-transform:uppercase}.name{color:var(--a);font-weight:600}.g{color:var(--g)}.pager{display:flex;align-items:center;gap:8px;margin-top:10px}@media(max-width:1000px){.tools{grid-template-columns:repeat(3,1fr)}.tools input:first-child{grid-column:1/-1}}
</style></head><body><header><div style="font-size:22px;font-weight:800">Warframe Market Trader</div><div class="sub">Полный каталог · локальная SQLite · фоновые обновления · realtime newOrders</div><div class="tools"><input id="search" placeholder="Поиск предмета..."><input id="min" type="number" placeholder="Min цена"><input id="max" type="number" placeholder="Max цена"><input id="roi" type="number" placeholder="Min ROI %"><input id="liq" type="number" placeholder="Min liquidity"><select id="sort"><option value="score">Score</option><option value="name">Name</option><option value="min">Min</option><option value="median">Median</option><option value="roi">ROI</option><option value="buy">Buy max</option><option value="sellers">Sellers</option><option value="buyers">Buyers</option><option value="liquidity">Liquidity</option><option value="updated">Updated</option></select><select id="order"><option value="desc">↓</option><option value="asc">↑</option></select><button onclick="load()">Обновить</button></div></header><main><div class="stats" id="stats"></div><div class="wrap"><table><thead><tr><th>Предмет</th><th>Min</th><th>Median</th><th>ROI</th><th>Buy</th><th>Sellers</th><th>Buyers</th><th>Liquidity</th><th>Score</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button onclick="prev()">←</button><span id="page"></span><button onclick="next()">→</button></div></main><script>
let p=1;const ps=100,$=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),price=v=>v==null?'—':Number(v).toFixed(Number(v)<10?1:0)+'p',pct=v=>v==null?'—':Number(v).toFixed(1)+'%';async function load(){let q=new URLSearchParams({page:p,page_size:ps,search:$('search').value,sort:$('sort').value,order:$('order').value});if($('min').value)q.set('min_price',$('min').value);if($('max').value)q.set('max_price',$('max').value);if($('roi').value)q.set('min_roi',$('roi').value);if($('liq').value)q.set('min_liquidity',$('liq').value);let[a,b]=await Promise.all([fetch('/api/items?'+q).then(r=>r.json()),fetch('/api/stats').then(r=>r.json())]);$('rows').innerHTML=a.items.map(x=>`<tr><td><a class="name" target="_blank" href="/api/items/${encodeURIComponent(x.slug)}">${e(x.name)}</a></td><td>${price(x.min_price)}</td><td>${price(x.median)}</td><td class="g">${pct(x.roi)}</td><td>${price(x.buy_max)}</td><td>${x.sellers??'—'}</td><td>${x.buyers??'—'}</td><td>${x.liquidity==null?'—':Number(x.liquidity).toFixed(0)}</td><td>${x.score==null?'—':Number(x.score).toFixed(0)}</td><td>${x.updated_at?new Date(x.updated_at*1000).toLocaleString():'—'}</td></tr>`).join('');$('page').textContent=`Страница ${a.page}/${Math.max(1,Math.ceil(a.total/a.page_size))} · товаров ${a.total}`;$('stats').innerHTML=`<span class="badge">Каталог: ${b.items??0}</span><span class="badge">С ценами: ${b.priced??0}</span><span class="badge">Avg liquidity: ${b.avg_liquidity==null?'—':Number(b.avg_liquidity).toFixed(0)}</span><span class="badge">Last update: ${b.last_update?new Date(b.last_update*1000).toLocaleString():'—'}</span>`}function next(){p++;load()}function prev(){if(p>1){p--;load()}}for(const id of ['search','min','max','roi','liq','sort','order'])$(id).addEventListener('change',()=>{p=1;load()});$('search').addEventListener('keydown',x=>{if(x.key==='Enter'){p=1;load()}});load();</script></body></html>
